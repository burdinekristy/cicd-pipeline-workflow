name: CI/CD Pipeline

# 1. Trigger the workflow on code pushes to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Checkout your repository code into the runner environment
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup your environment (e.g., Python, Node.js, etc.)
    - name: Set up Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    # Run automated unit/integration tests
    - name: Run Unit Tests
      run: |
        pytest

  deploy:
    needs: build-and-test # Only deploy if tests pass successfully
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Staging
      run: |
        echo "All test passed! Deploying application to staging environment..."
        # Add you actual deployment script or server connection commands here

