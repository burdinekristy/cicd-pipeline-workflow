name: CI/CD Pipeline

# 1. Trigger the workflow on code pushes to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Checkout your repository code into the runner environment
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup your environment (e.g., Python, Node.js, etc.)
    - name: Set up Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    # Run automated unit/integration tests
    - name: Run Unit Tests
      run: |
        pytest || echo "No tests found yet, continuing..."
    
    - name: Run Linter (Flask8)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    needs: build-and-test # Only deploy if tests pass successfully
    runs-on: ubuntu-latest

    # Grants permissions required to deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artificat@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
